<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Gravity Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevent scrollbars from appearing */
        }
        canvas {
            display: block;
            background-color: #000010;
            cursor: crosshair;
        }
        .control-panel {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-color: rgba(23, 23, 33, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes shake {
          10%, 90% { transform: translateX(-1px); }
          20%, 80% { transform: translateX(2px); }
          30%, 50%, 70% { transform: translateX(-4px); }
          40%, 60% { transform: translateX(4px); }
        }
        .shake {
          animation: shake 0.5s ease-in-out;
        }
        .toast {
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from { bottom: -50px; opacity: 0; }
            to { bottom: 80px; opacity: 1; }
        }
        @keyframes fadeout {
            from { bottom: 80px; opacity: 1; }
            to { bottom: -50px; opacity: 0; }
        }
    </style>
</head>
<body class="bg-gray-900 text-white m-0 p-0">

    <!-- Welcome Screen Overlay -->
    <div id="welcome-screen" class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-80 backdrop-blur-sm flex flex-col justify-center items-center z-50">
        <div class="text-center p-8 bg-gray-800 border border-gray-700 rounded-lg shadow-2xl animate-fade-in">
            <h1 class="text-4xl font-bold text-indigo-400 mb-2">SIX SIGMA SIMULATION</h1>
            <p class="text-gray-400 mb-6">created at Taxila Business School Jaipur</p>
            <input type="text" id="playerName" placeholder="Enter your name" class="w-full max-w-xs px-4 py-2 bg-gray-700 border border-gray-600 rounded-md text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-4">
            <button id="startButton" class="w-full max-w-xs px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-md font-semibold transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400">
                Start Simulation
            </button>
        </div>
    </div>

    <canvas id="simulationCanvas"></canvas>

    <!-- UI Controls Panel -->
    <div class="control-panel fixed bottom-4 left-1/2 -translate-x-1/2 p-4 rounded-lg shadow-2xl flex items-center gap-6 z-10">
        <div class="flex flex-col items-center">
            <label for="massSlider" class="text-sm font-medium text-gray-300 mb-1">New Body Mass</label>
            <input type="range" id="massSlider" min="10" max="2000" value="150" class="w-36">
        </div>
        <div class="flex flex-col items-center">
            <label for="gravitySlider" class="text-sm font-medium text-gray-300 mb-1">Gravity</label>
            <input type="range" id="gravitySlider" min="0.1" max="2" value="0.5" step="0.05" class="w-36">
        </div>
        <button id="saveButton" class="px-4 py-2 bg-green-600 hover:bg-green-500 rounded-md font-semibold transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-green-400">
            Save
        </button>
        <button id="resetGameButton" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-md font-semibold transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-red-400">
            Reset Game
        </button>
        <div class="flex flex-col items-center">
             <label for="trailToggle" class="text-sm font-medium text-gray-300">Trails</label>
             <input type="checkbox" id="trailToggle" class="toggle-checkbox mt-1 h-6 w-12 rounded-full bg-gray-600 appearance-none transition duration-200 ease-in-out cursor-pointer checked:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-400" checked>
        </div>
    </div>
    
    <!-- Instructions -->
    <div id="instructions" class="fixed top-4 left-4 p-4 bg-gray-800 bg-opacity-70 rounded-lg text-gray-300 text-sm max-w-xs z-10">
        <h3 class="font-bold text-white mb-2">How to Interact</h3>
        <p><strong>Click and Drag:</strong> Set a new celestial body's starting position and velocity vector.</p>
        <p class="mt-2"><strong>Release:</strong> Launch the new body into the cosmos!</p>
        <p class="mt-2">Adjust the mass of new bodies using the slider below.</p>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-20 bg-indigo-500 text-white px-6 py-3 rounded-lg shadow-lg">
        Game Saved!
    </div>


<script>
    const canvas = document.getElementById('simulationCanvas');
    const ctx = canvas.getContext('2d');

    // --- Configuration ---
    const PARTICLE_DENSITY = 0.1;
    const MIN_MERGE_MASS_RATIO = 5; // A body must be 5x more massive to absorb another
    const SOFTENING_FACTOR = 5; // Prevents extreme forces at very close distances
    const SAVE_KEY = 'sixSigmaSimulationSave';

    let particles = [];
    let isMouseDown = false;
    let startPos = { x: 0, y: 0 };
    let endPos = { x: 0, y: 0 };
    let trailsEnabled = true;
    let audioCtx; // For Web Audio API
    let playerName = '';

    // --- UI Elements ---
    const saveButton = document.getElementById('saveButton');
    const resetGameButton = document.getElementById('resetGameButton');
    const massSlider = document.getElementById('massSlider');
    const trailToggle = document.getElementById('trailToggle');
    const gravitySlider = document.getElementById('gravitySlider');
    const welcomeScreen = document.getElementById('welcome-screen');
    const startButton = document.getElementById('startButton');
    const playerNameInput = document.getElementById('playerName');
    const toast = document.getElementById('toast');

    // --- Particle Class ---
    class Particle {
        constructor(x, y, mass, vx = 0, vy = 0) {
            this.x = x;
            this.y = y;
            this.mass = mass;
            this.radius = Math.cbrt(mass / PARTICLE_DENSITY);
            this.vx = vx;
            this.vy = vy;
            this.fx = 0; // Force in x
            this.fy = 0; // Force in y
        }

        applyForce(other, G) {
            const dx = other.x - this.x;
            const dy = other.y - this.y;
            const distSq = dx * dx + dy * dy + SOFTENING_FACTOR * SOFTENING_FACTOR;
            const dist = Math.sqrt(distSq);
            if (dist === 0) return;
            const force = (G * this.mass * other.mass) / distSq;
            this.fx += force * (dx / dist);
            this.fy += force * (dy / dist);
        }

        update() {
            const ax = this.fx / this.mass;
            const ay = this.fy / this.mass;
            this.vx += ax;
            this.vy += ay;
            this.x += this.vx;
            this.y += this.vy;
            this.fx = 0;
            this.fy = 0;
        }

        draw() {
            const massRatio = Math.min(this.mass / 2000, 1);
            const r = Math.floor(200 + massRatio * 55);
            const g = Math.floor(220 - massRatio * 100);
            const b = Math.floor(255 - massRatio * 255);
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            if (this.mass > 500) {
                const glowStrength = Math.min((this.mass - 500) / 1500, 1) * 0.8;
                ctx.shadowBlur = this.radius * 2;
                ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${glowStrength})`;
            }
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }
function getUserId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("userId") || "guest";
    }
    // --- Game State Functions ---
   async function saveGame() {
        const userId = getUserId()
        if (!playerName) return; // Can't save without a player
        const gameState = {
            playerName: playerName,
            particles: particles.map(p => ({
                x: p.x,
                y: p.y,
                mass: p.mass,
                vx: p.vx,
                vy: p.vy
            }))
        };
        try {
                    const response = await fetch('https://erp.taxila.in/api/game/solar', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({userId:userId, name:gameState.playerName, gameState:gameState}),
                    });

                    if (response.ok) {
                         showToast("Game Saved!");
                    } else {
                         showToast("Failed to save game.!");
                    }
                } catch (error) {
                    console.error('Error saving game:', error);
                } 
    }

    async function loadGame() {
        const userId = getUserId();
        try {
            const response = await fetch(`https://erp.taxila.in/api/game/solar?userId=${userId}`);
            if (!response.ok) {
                console.log("No saved game found for this user.");
                return false; // No save file, so don't load.
            }

            const data = await response.json();

            // Check if gameState exists, is an object, and is not empty
            if (data && data.gameState && typeof data.gameState === 'object' && Object.keys(data.gameState).length > 0) {
                const savedGame = data.gameState;
                if (savedGame.playerName && Array.isArray(savedGame.particles)) {
                    playerName = savedGame.playerName;
                    playerNameInput.value = playerName;
                    particles = savedGame.particles.map(p => new Particle(p.x, p.y, p.mass, p.vx, p.vy));
                    return true; // Game loaded successfully
                }
            }
             // Handles cases where gameState is {} or malformed
            console.log("Found an empty or invalid game state in the save file.");
            return false;
        } catch (error) {
            console.error('Error loading game:', error);
            return false; // Error occurred, so don't load.
        }
    }


    function resetGame() {
        localStorage.removeItem(SAVE_KEY);
        startNewGame();
    }
    
    function showToast(message) {
        toast.textContent = message;
        toast.className = "toast fixed left-1/2 -translate-x-1/2 bg-indigo-500 text-white px-6 py-3 rounded-lg shadow-lg z-20";
        setTimeout(() => {
            toast.className += " hidden";
        }, 3000);
    }

    // --- Simulation Functions ---
    function startNewGame() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        const sun = new Particle(canvas.width / 2, canvas.height / 2, 10000, 0, 0);
        const planet = new Particle(canvas.width / 2 + 300, canvas.height / 2, 200, 0, -5);
        particles.push(sun, planet);
    }
    
    function animate() {
        if (trailsEnabled) {
            ctx.fillStyle = 'rgba(0, 0, 16, 0.2)';
        } else {
            ctx.fillStyle = '#000010';
        }
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const G = parseFloat(gravitySlider.value);

        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                particles[i].applyForce(particles[j], G);
                particles[j].applyForce(particles[i], G);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update();
            particles[i].draw();

            for (let j = i - 1; j >= 0; j--) {
                const p1 = particles[i];
                const p2 = particles[j];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < p1.radius + p2.radius) {
                    const heavier = p1.mass > p2.mass ? p1 : p2;
                    const lighter = p1.mass <= p2.mass ? p1 : p2;

                    if (heavier.mass / lighter.mass > MIN_MERGE_MASS_RATIO) {
                        const totalMass = heavier.mass + lighter.mass;
                        heavier.vx = (heavier.mass * heavier.vx + lighter.mass * lighter.vx) / totalMass;
                        heavier.vy = (heavier.mass * heavier.vy + lighter.mass * lighter.vy) / totalMass;
                        heavier.mass = totalMass;
                        heavier.radius = Math.cbrt(heavier.mass / PARTICLE_DENSITY);
                        playSound('merge', { mass: totalMass });
                        particles.splice(j, 1);
                        i--;
                        break;
                    }
                }
            }
        }
        
        if (isMouseDown) {
            ctx.beginPath();
            ctx.moveTo(startPos.x, startPos.y);
            ctx.lineTo(endPos.x, endPos.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        requestAnimationFrame(animate);
    }
    
    function initializeSimulation() {
        // Initialize Audio on user gesture
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        // Hide the welcome screen
        welcomeScreen.style.transition = 'opacity 0.5s ease';
        welcomeScreen.style.opacity = '0';
        setTimeout(() => {
            welcomeScreen.style.display = 'none';
        }, 500);
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        animate(); // Start the animation loop
    }

    // --- Event Listeners ---
    function handleResize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    saveButton.addEventListener('click', saveGame);
    resetGameButton.addEventListener('click', resetGame);
    trailToggle.addEventListener('change', (e) => {
        trailsEnabled = e.target.checked;
    });

    canvas.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        startPos = { x: e.clientX, y: e.clientY };
        endPos = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener('mousemove', (e) => {
        if (isMouseDown) {
            endPos = { x: e.clientX, y: e.clientY };
        }
    });

    canvas.addEventListener('mouseup', (e) => {
        if (!isMouseDown) return;
        isMouseDown = false;
        
        const mass = parseFloat(massSlider.value);
        const vx = (endPos.x - startPos.x) / 20;
        const vy = (endPos.y - startPos.y) / 20;
        
        particles.push(new Particle(startPos.x, startPos.y, mass, vx, vy));
        playSound('create', { mass });
    });
    
    window.addEventListener('resize', handleResize);
    
    startButton.addEventListener('click', () => {
        const name = playerNameInput.value.trim();
        if (name === '') {
            playerNameInput.classList.add('shake');
            playerNameInput.style.borderColor = '#ef4444';
            playerNameInput.placeholder = "Please enter your name first!";
            setTimeout(() => {
                playerNameInput.classList.remove('shake');
                playerNameInput.style.borderColor = '';
            }, 500);
        } else {
            playerName = name;
            startNewGame();
            initializeSimulation();
        }
    });
    
    // --- Audio Engine ---
    function playSound(type, options = {}) {
        if (!audioCtx) return;
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'create') {
            const mass = options.mass || 150;
            const baseFreq = 200;
            const maxFreq = 1000;
            const freq = baseFreq + (Math.log(mass) / Math.log(2000)) * (maxFreq - baseFreq);
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(freq, now);
            gainNode.gain.setValueAtTime(0.25, now);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.5);
            oscillator.start(now);
            oscillator.stop(now + 0.5);
        } else if (type === 'merge') {
            const totalMass = options.mass || 10000;
            const bufferSize = audioCtx.sampleRate * 1.0;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(12000, now);
            filter.frequency.exponentialRampToValueAtTime(400, now + 0.75);
            const explosionGain = audioCtx.createGain();
            const volume = Math.min(Math.log10(totalMass) / 5, 0.7);
            explosionGain.gain.setValueAtTime(volume, now);
            explosionGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
            noise.connect(filter);
            filter.connect(explosionGain);
            explosionGain.connect(audioCtx.destination);
            const boom = audioCtx.createOscillator();
            boom.type = 'sine';
            const boomFreq = Math.max(120 - Math.log2(totalMass) * 5, 40);
            boom.frequency.setValueAtTime(boomFreq, now);
            boom.frequency.exponentialRampToValueAtTime(40, now + 0.5);
            const boomGain = audioCtx.createGain();
            boomGain.gain.setValueAtTime(0.9, now);
            boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            boom.connect(boomGain);
            boomGain.connect(audioCtx.destination);
            noise.start(now);
            boom.start(now);
            noise.stop(now + 1.0);
            boom.stop(now + 0.5);
        }
    }

    // --- Initial Start ---
    window.onload = async () => {
        if (await loadGame()) {
            // If a game is loaded successfully, bypass the welcome screen and start
            initializeSimulation();
        }
        // Otherwise, the welcome screen will just stay visible, which is what we want.
    };
</script>

</body>
</html>
