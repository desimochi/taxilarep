                    this.synth.triggerAttackRelease("G4", "8n", now + 0.4); 
                }
            },
            playGameOver() { 
                if (this.isReady) { 
                    const now = Tone.now();
                    this.synth.triggerAttackRelease("G4", "4n", now); 
                    this.synth.triggerAttackRelease("C4", "4n", now + 0.4); 
                }
            }

        function createEnvironment() {

        function createGuessCards(guesses) {
            clearSceneObjects();
            const isMobile = window.innerWidth < 768;
            const positions = isMobile 
                ? [{x: 0, y: 3, z: 0}, {x: 0, y: 1.5, z: 0}, {x: 0, y: 0, z: 0}]
                : [{x: -3, y: 1.5, z: 0}, {x: 0, y: 1.5, z: 0}, {x: 3, y: 1.5, z: 0}];

            guesses.forEach((guess, i) => {
                const cardGroup = new THREE.Group();
                const cardGeom = new THREE.BoxGeometry(1.8, 2.2, 0.1);
                const cardMat = new THREE.MeshStandardMaterial({ color: 0x374151, roughness: 0.5 });
                const card = new THREE.Mesh(cardGeom, cardMat);
                card.castShadow = true;
                cardGroup.add(card);
                cardGroup.position.set(positions[i].x, positions[i].y, positions[i].z);
                
                if (FONT) {
                    const nameGeom = new TextGeometry(guess.name, { font: FONT, size: 0.15, height: 0.02 });
                    nameGeom.center();
                    const nameMat = new THREE.MeshStandardMaterial({ color: 0x9CA3AF });
                    const nameMesh = new THREE.Mesh(nameGeom, nameMat);
                    nameMesh.position.set(0, 0.7, 0.06);
                    cardGroup.add(nameMesh);

                    const guessGeom = new TextGeometry(guess.value.toLocaleString('en-IN'), { font: FONT, size: 0.4, height: 0.02 });
                    guessGeom.center();
                    const guessMat = new THREE.MeshStandardMaterial({ color: 0x3B82F6 });
                    const guessMesh = new THREE.Mesh(guessGeom, guessMat);
                    guessMesh.position.set(0, 0, 0.06);
                    cardGroup.add(guessMesh);
                }
                
                cardGroup.userData = { type: 'guessCard', playerId: i };
                scene.add(cardGroup);
                guessCards.push(cardGroup);
            });
        }
        
        function createBettingChip() {
            bettingChips.forEach(chip => scene.remove(chip));

            chip.position.set(0, 1.2, 3.5);
            chip.userData = { type: 'chip', isDragging: false };
            scene.add(chip);
            bettingChips.push(chip);
        }

            guessCards.forEach(card => scene.remove(card));

        }

        // --- GAME LOGIC ---
        function initializeGame() {
            const playerNameInput = document.getElementById('player-name-input');
            gameState.playerName = playerNameInput.value || 'Analyst';

            const difficulties = {
                'Easy': ['Easy'],
                'Medium': ['Easy', 'Medium'],
                'Hard': ['Hard']
            };
            const allowedDifficulties = difficulties[gameState.difficulty];
            const availableCases = allCases.filter(c => allowedDifficulties.includes(c.difficulty));
            
            const shuffledCases = [...availableCases].sort(() => 0.5 - Math.random());
            
            const maxRounds = 20;
            gameState.totalRounds = Math.min(maxRounds, shuffledCases.length);
            if(gameState.totalRounds < maxRounds && allowedDifficulties.length === 1 && availableCases.length < maxRounds){
                console.warn(`Warning: Not enough unique questions for 20 rounds on ${gameState.difficulty} difficulty. Game will have ${gameState.totalRounds} rounds.`);
            }
            gameState.cases = shuffledCases.slice(0, gameState.totalRounds);
            
            gameState.players = [
                { name: gameState.playerName, score: 0, isAI: false, id: 0 },
                { name: 'Asha', score: 0, isAI: true, id: 1 },
                { name: 'Bala', score: 0, isAI: true, id: 2 }
            ];
            gameState.currentRound = 0;
            
            startNewRound();
        }

        function startNewRound() {
            clearSceneObjects();
            playerInput = '';
            gameState.currentRound++;
            
            if (gameState.currentRound > gameState.totalRounds || gameState.cases.length === 0) {
                 gameState.phase = 'GAME_OVER';
                 soundManager.playGameOver();
                 updateUI();
                 clearSave();
                 return;
            }
            gameState.currentCase = gameState.cases.pop();
            gameState.phase = 'STANDARD_GUESS';
            soundManager.playRoundStart();
            updateUI();
        }
        
        function scoreStandardPart(betOnPlayerId) {
            const answer = gameState.currentCase.standard.answer;

            gameState.phase = 'STANDARD_RESULTS';
            
            let closestPlayerId = -1;
            if (typeof answer === 'number') {
                let smallestDiff = Infinity;
                for (let i = 0; i < gameState.playerGuesses.length; i++) {
                    const diff = Math.abs(gameState.playerGuesses[i].value - answer);
                    if (diff < smallestDiff) {
                        smallestDiff = diff;
                        closestPlayerId = i;
                    }
                }
            }
            
            gameState.players.forEach((p, i) => {
                let scoreDelta = 0;
                if (i === closestPlayerId) scoreDelta += 100;
                if (!p.isAI && betOnPlayerId === closestPlayerId) {
                    scoreDelta += 150;
                    soundManager.playCorrect();
                } else if (!p.isAI && betOnPlayerId !== -1 && betOnPlayerId !== closestPlayerId) {
                    soundManager.playIncorrect();
                }
                p.score += scoreDelta;
            });

            gameState.standardResults = {
                betOnPlayerId: betOnPlayerId,
                closestPlayerId: closestPlayerId,
                correctAnswer: answer,
            };
            saveGame();
            updateUI();
        }

        function scoreFermiPart(playerVariableGuesses) {
            if (!gameState.playerGuesses || gameState.playerGuesses.length === 0) {
                // Failsafe in case this is called in a bad state.
                gameState.playerGuesses = [{}, {}, {}];
            }
            gameState.playerGuesses[0].variableGuesses = playerVariableGuesses;
            const fullCase = gameState.currentCase;
            const variables = fullCase.fermi.variables;
            const formula = fullCase.solution_formula;

            const sanitizedVariables = {};
            for (const varName in variables) {
                sanitizedVariables[varName] = Number(variables[varName]) || 0;
            }
            const finalAnswer = formula(sanitizedVariables);
            
            gameState.fermiResults = { correctAnswer: finalAnswer };

            gameState.players.forEach(p => {
                if (p.isAI) {
                    const aiVariableGuesses = {};
                    const varianceMultiplier = p.id === 1 ? 0.4 : 1.0; 
                    const baseMultiplier = p.id === 1 ? 0.8 : 0.5;
                    for (const varName in variables) {
                        const actual = variables[varName];
                        aiVariableGuesses[varName] = actual * (baseMultiplier + (Math.random() * varianceMultiplier));
                    }
                    if (gameState.playerGuesses[p.id]) {
                        gameState.playerGuesses[p.id].variableGuesses = aiVariableGuesses;
                    }
                }
            });

            let closestDerivedPlayerId = -1;
            let smallestDerivedDiff = Infinity;
            
            gameState.players.forEach((p, i) => {
                const currentGuesses = (gameState.playerGuesses[i] && gameState.playerGuesses[i].variableGuesses) ? gameState.playerGuesses[i].variableGuesses : {};
                
                const saneGuesses = {};
                for (const varName in variables) {
                    saneGuesses[varName] = Number(currentGuesses[varName]) || 0;
                }
                const derivedAnswer = formula(saneGuesses);
                const diff = Math.abs(derivedAnswer - finalAnswer);
                
                if (!isNaN(diff) && diff < smallestDerivedDiff) {
                    smallestDerivedDiff = diff;
                    closestDerivedPlayerId = i;
                }
            });
            
            gameState.players.forEach((p, i) => {
                let scoreDelta = 0;
                let percentAccuracyTotal = 0;
                let varCount = 0;
                const currentGuesses = (gameState.playerGuesses[i] && gameState.playerGuesses[i].variableGuesses) ? gameState.playerGuesses[i].variableGuesses : {};

                for (const varName in variables) {
                    const actual = Number(variables[varName]);
                    const guess = Number(currentGuesses[varName]) || 0; 
                    
                    let accuracy = 0;
                    if (!isNaN(actual) && !isNaN(guess)) {
                        accuracy = (actual !== 0) ? 100 - (Math.abs(actual - guess) / Math.abs(actual)) * 100 : (guess === 0 ? 100 : 0);
                    }
                    percentAccuracyTotal += Math.max(0, accuracy); 
                    varCount++;
                }
                
                if (varCount > 0) {
                    const avgAccuracy = percentAccuracyTotal / varCount;
                    scoreDelta += Math.round(avgAccuracy * 2);
                }

                if (closestDerivedPlayerId === i) {
                    scoreDelta += 150;
                }
                p.score += scoreDelta;
                if (!p.isAI && scoreDelta > 0) soundManager.playCorrect();
            });
            saveGame();
        }

        function handleUIClick(event) {
            const target = event.target.closest('.ui-element');
            if (!target) return;
            
            let playGenericClick = true;

            if (target.id === 'start-btn') {
                initializeGame();
                playGenericClick = false; 
            } else if (target.matches('.difficulty-btn')) {
                gameState.difficulty = target.dataset.difficulty;
                document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('ring-4', 'ring-blue-400'));
                target.classList.add('ring-4', 'ring-blue-400');
            } else if (target.id === 'next-round-btn') {
                startNewRound();
                playGenericClick = false;
            } else if (target.id === 'play-again-btn') {
                gameState.phase = 'START_SCREEN';
                clearSave();
                updateUI();
            } else if (target.id === 'continue-fermi-btn') {
                gameState.phase = 'FERMI_GUESS';
                clearSceneObjects();
                updateUI();
            } else if (target.id === 'submit-fermi-btn') {
                const playerVariableGuesses = {};
                let allValid = true;
                const errorMsgEl = document.getElementById('fermi-error-msg');
                if (errorMsgEl) errorMsgEl.textContent = ''; 

                for (const varName in gameState.currentCase.fermi.variables) {
                    const input = document.querySelector(`input[data-var="${varName}"]`);
                    if (input) {
                        const value = parseFloat(input.value);
                        if (isNaN(value) || input.value.trim() === '') {
                            allValid = false;
                            input.classList.add('border-2', 'border-red-500');
                        } else {
                            input.classList.remove('border-2', 'border-red-500');
                            playerVariableGuesses[varName] = value;
                        }
                    } else {
                        allValid = false; 
                    }
                }

                if (allValid) {
                    scoreFermiPart(playerVariableGuesses);
                    gameState.phase = 'FERMI_RESULTS';
                    updateUI();
                } else {
                    if (errorMsgEl) {
                        errorMsgEl.textContent = 'Please fill all fields with numbers.';
                    }
                    soundManager.playIncorrect();
                }
                playGenericClick = false;

            } else if (target.matches('.keypad-key')) {
                const val = target.dataset.key;
                if (val === 'OK') {
                    playGenericClick = false; 
                    const answer = gameState.currentCase.standard.answer;
                    
                    if(typeof answer !== 'number') {
                         scoreStandardPart(-1); 
                         return; 
                    }

                    const pGuess = parseInt(playerInput, 10) || 0;
                    const ai1Guess = Math.floor(answer * (0.8 + Math.random() * 0.4));
                    const ai2Guess = Math.floor(answer * (0.5 + Math.random() * 1.0));
                    
                    gameState.playerGuesses = [
                        { name: gameState.playerName, value: pGuess },
                        { name: 'Asha', value: ai1Guess },
                        { name: 'Bala', value: ai2Guess }
                    ];

                    createGuessCards(gameState.playerGuesses);
                    createBettingChip();
                    
                    gameState.phase = 'BETTING_PHASE';
                    updateUI();
                } else {
                    if (val === 'C') {
                        playerInput = '';
                    } else if (playerInput.length < 9) {
                        playerInput += val;
                    }
                    const display = document.getElementById('input-display');
                    if(display) display.textContent = playerInput || '0';
                }
            } else if (target.id === 'share-linkedin-btn') {
                const playerScore = gameState.players[0].score;
                const text = `I'm proud to have successfully completed the Andaza Apna Apna Guesstimation Challenge! This was a fantastic exercise in analytical and logical reasoning. My final score was ${playerScore.toLocaleString('en-IN')} on ${gameState.difficulty} mode.\n\nA big thank you to Taxila Business School for creating this engaging and valuable learning tool. Highly recommended for anyone looking to sharpen their business acumen.\n\n#TaxilaBusinessSchool #Guesstimation #CaseStudy #BusinessStrategy #AnalyticalSkills #MBA`;
                const url = "https://www.taxila.in/"; 
                const linkedinUrl = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(url)}&title=${encodeURIComponent("Completed the Guesstimation Challenge!")}&summary=${encodeURIComponent(text)}`;
                window.open(linkedinUrl, '_blank');
            }

            if (playGenericClick) {
                soundManager.playClick();
            }
        }
         function getUserId() {
        const params = new URLSearchParams(window.location.search);
        return params.get("userId") || "guest";
    }
        // --- PERSISTENCE ---
      async function saveGame() {
            const userId = getUserId();

            if (!userId) return; // only exit if no userId found
 const params = new URLSearchParams(window.location.search);
 const name =  JSON.parse(decodeURIComponent(params.get("name")));
            try {
                const res = await fetch("https://erp.taxila.in/api/game/guesstimations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId, name, gameState }),
                });

                if (!res.ok) {
                    console.error("Failed to save game state:", await res.text());
                } else {
                    console.log("Game state saved for", userId);
                }
            } catch (err) {
                console.error("Error saving game state:", err);
            }
        }

     async function loadGame() {
            const userId = getUserId();
            const res = await fetch(`https://erp.taxila.in/api/game/guesstimations?userId=${userId}`)
            const savedData = await res.json();
            
            if (savedData && Object.keys(savedData).length > 0) { // Check if savedData is not empty
                gameState = savedData;
                // Re-link currentCase to the original allCases object to ensure solution_formula works
                if (gameState.currentCase) {
                    gameState.currentCase = allCases.find(c => c.id === gameState.currentCase.id);
                }
                return true;
            }
            return false;
        }

        async function clearSave() {
            const userId = getUserId();
            if (!userId) return; // only exit if no userId found

            try {
                // Set gameState to an empty object to clear the saved state
                const emptyGameState = {}; 
                const res = await fetch("https://erp.taxila.in/api/game/guesstimations", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId, gameState: emptyGameState }),
                });

                if (!res.ok) {
                    console.error("Failed to clear game state:", await res.text());
                } else {
                    console.log("Game state cleared for", userId);
                }
            } catch (err) {
                console.error("Error clearing game state:", err);
            }
        }
        
        async function checkForSavedGame() {
            // Await loadGame to ensure it completes before proceeding
            const gameFound = await loadGame(); 
            if (gameFound) {
                document.getElementById('resume-modal').classList.remove('hidden');
            } else {
                gameState.phase = 'START_SCREEN';
                updateUI();
            }
        }

        // --- INTERACTION & ANIMATION ---
        let selectedChip = null;
        let plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.5);

        function onPointerDown(event) {
            if (!soundManager.isReady) {
                Tone.start();
                soundManager.init();
            }

            if (gameState.phase !== 'BETTING_PHASE') return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(bettingChips);

            if (intersects.length > 0) {
                selectedChip = intersects[0].object;
                selectedChip.userData.isDragging = true;
                controls.enabled = false;
            }
        }

        function onPointerMove(event) {
            if (selectedChip && selectedChip.userData.isDragging) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                const intersectionPoint = new THREE.Vector3();
                raycaster.ray.intersectPlane(plane, intersectionPoint);
                selectedChip.position.set(intersectionPoint.x, 1.5, intersectionPoint.z);
            }
        }

        function onPointerUp(event) {
            if (selectedChip) {
                let droppedOnCard = false;
                for (const card of guessCards) {
                    const cardPosition = new THREE.Vector3();
                    card.getWorldPosition(cardPosition);
                    plane.constant = -cardPosition.y;

                    const distance = selectedChip.position.distanceTo(cardPosition);
                    
                    if (distance < 1.5) {
                        selectedChip.position.set(cardPosition.x, cardPosition.y + 0.2, cardPosition.z);
                        droppedOnCard = true;
                        
                        const betOnPlayerId = card.userData.playerId;
                        
                        setTimeout(() => {
                           scoreStandardPart(betOnPlayerId);
                        }, 500);
                        break;
                    }
                }
                
                if (!droppedOnCard) {
                    selectedChip.position.set(0, 1.2, 3.5);
                }

                selectedChip.userData.isDragging = false;
                selectedChip = null;
                controls.enabled = true;
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (gameState.phase === 'BETTING_PHASE' && gameState.playerGuesses) {
                createGuessCards(gameState.playerGuesses);
                createBettingChip();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // --- START ---
        init();
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        document.body.addEventListener('click', handleUIClick);
        document.getElementById('resume-yes-btn').addEventListener('click', () => {
            document.getElementById('resume-modal').classList.add('hidden');
            updateUI();
             if (gameState.phase === 'BETTING_PHASE') {
                createGuessCards(gameState.playerGuesses);
                createBettingChip();
            }
        });
        document.getElementById('resume-no-btn').addEventListener('click', () => {
            document.getElementById('resume-modal').classList.add('hidden');
            clearSave();
            gameState.phase = 'START_SCREEN';
            updateUI();
        });

    </script>
