<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordify Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --bg-color: #f4f4f8;
            --text-color: #1a1a1b;
            --key-bg: #d3d6da;
            --key-text: #1a1a1b;
            --key-shadow: #a7aab1;
            --absent-bg: #787c7e;
            --absent-shadow: #4a4d4e;
            --present-bg: #c9b458;
            --present-shadow: #968642;
            --correct-bg: #6aaa64;
            --correct-shadow: #4a7c46;
            --tile-text-color: #ffffff;
            --cert-border: #a88f5a;
            --cert-bg: #fdfaf2;
        }
        .dark {
             --bg-color: #121213;
             --text-color: #f8f8f8;
             --key-bg: #818384;
             --key-text: #ffffff;
             --key-shadow: #505152;
             --cert-border: #c9b458;
             --cert-bg: #1a1a1b;
        }

        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s;
        }

        .tile {
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 2px solid #d3d6da;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: bold;
            text-transform: uppercase;
            user-select: none;
            color: var(--text-color);
            background-color: var(--bg-color);
            transition: transform 0.6s, background-color 0.6s, border-color 0.6s;
            transform-style: preserve-3d;
        }
        
        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .tile.filled {
            border-color: #878a8c;
        }

        .tile.pop {
             animation: pop 0.15s ease-out;
        }

        .tile .tile-front, .tile .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }
        
        .tile .tile-front {
            background-color: var(--bg-color);
            border: 2px solid #d3d6da;
             color: var(--text-color);
        }

        .tile .tile-back {
            color: var(--tile-text-color);
            transform: rotateX(180deg);
        }

        .tile.flip .tile-inner {
            transform: rotateX(180deg);
        }
        .tile.absent .tile-back {
            background-color: var(--absent-bg);
            border-color: var(--absent-bg);
        }
        .tile.present .tile-back {
            background-color: var(--present-bg);
            border-color: var(--present-bg);
        }
        .tile.correct .tile-back {
            background-color: var(--correct-bg);
            border-color: var(--correct-bg);
        }
        
        .key {
            background-color: var(--key-bg);
            color: var(--key-text);
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0 0 var(--key-shadow);
            transition: all 0.1s ease-out;
        }
        .key:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 0 var(--key-shadow);
        }

        .key.absent {
            background-color: var(--absent-bg);
            color: var(--tile-text-color);
            box-shadow: 0 4px 0 0 var(--absent-shadow);
        }
        .key.present {
            background-color: var(--present-bg);
            color: var(--tile-text-color);
            box-shadow: 0 4px 0 0 var(--present-shadow);
        }
        .key.correct {
            background-color: var(--correct-bg);
            color: var(--tile-text-color);
            box-shadow: 0 4px 0 0 var(--correct-shadow);
        }

        #game-board {
            perspective: 1000px;
        }
        
        #modal-content {
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -2px rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: var(--bg-color);
        }

        #certificate-container {
            border: 10px solid var(--cert-border);
            background-color: var(--cert-bg);
            padding: 1.5rem;
            font-family: 'Georgia', serif;
            color: #333;
        }
        .dark #certificate-container {
            color: #ddd;
        }


        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>

    <script type="module">
        document.addEventListener('DOMContentLoaded', () => {
            const gameBoard = document.getElementById('game-board');
            const keyboardContainer = document.getElementById('keyboard');
            const messageContainer = document.getElementById('message-container');
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modal-title');
            const modalMessage = document.getElementById('modal-message');
            const modalWord = document.getElementById('modal-word');
            const nextWordBtn = document.getElementById('next-word-btn');
            const titleElement = document.getElementById('game-title');
            const dateDisplay = document.getElementById('date-display');
            const soundToggleBtn = document.getElementById('sound-toggle');
            const scoreDisplay = document.getElementById('score-display');
            const timerDisplay = document.getElementById('timer-display');

            // Name Modal elements
            const nameModal = document.getElementById('name-modal');
            const playerNameInput = document.getElementById('player-name-input');
            const startGameBtn = document.getElementById('start-game-btn');
            
            // Certificate elements
            const standardModalContent = document.getElementById('standard-modal-content');
            const certificateContent = document.getElementById('certificate-content');
            const certPlayerName = document.getElementById('cert-player-name');
            const certScore = document.getElementById('cert-score');
            const certDate = document.getElementById('cert-date');
            const certTime = document.getElementById('cert-time');
            const linkedinShareBtn = document.getElementById('linkedin-share-btn');

            let playerName = '';

            // --- Sound State & Setup ---
            let isMuted = false;
            let audioReady = false;
            let audioCtx; // Use native AudioContext

            const soundOnIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
            const soundOffIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;
            soundToggleBtn.innerHTML = soundOnIcon;
            
            function setupAudio() {
                if (audioReady || isMuted) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                    audioReady = true;
                    console.log("Native Audio context started.");
                } catch(e) {
                    console.error("Could not initialize native AudioContext.", e);
                    isMuted = true;
                    soundToggleBtn.innerHTML = soundOffIcon;
                    soundToggleBtn.style.pointerEvents = 'none';
                    soundToggleBtn.style.opacity = '0.5';
                }
            }

            const playSound = (type, options = {}) => {
                if (isMuted || !audioReady || !audioCtx) return;
                try {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    const now = audioCtx.currentTime;

                    switch (type) {
                        case 'click':
                            oscillator.type = 'sine';
                            oscillator.frequency.setValueAtTime(100, now);
                            gainNode.gain.setValueAtTime(0.5, now);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                            oscillator.start(now);
                            oscillator.stop(now + 0.1);
                            break;
                        case 'flip':
                            const flipNotes = [392.00, 440.00, 493.88, 523.25, 587.33]; // G4, A4, B4, C5, D5
                            oscillator.type = 'sine';
                            oscillator.frequency.setValueAtTime(flipNotes[options.index] || 440, now);
                            gainNode.gain.setValueAtTime(0.3, now);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                            oscillator.start(now);
                            oscillator.stop(now + 0.15);
                            break;
                        case 'win':
                            const winNotes = [523.25, 659.25, 783.99]; // C5, E5, G5
                            winNotes.forEach((note, index) => {
                                const osc = audioCtx.createOscillator();
                                const g = audioCtx.createGain();
                                osc.connect(g);
                                g.connect(audioCtx.destination);
                                osc.frequency.setValueAtTime(note, now + index * 0.1);
                                g.gain.setValueAtTime(0.4, now + index * 0.1)
                                g.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.2)
                                osc.start(now + index * 0.1);
                                osc.stop(now + index * 0.1 + 0.2);
                            });
                            break;
                        case 'lose':
                            oscillator.type = 'sawtooth';
                            oscillator.frequency.setValueAtTime(200, now);
                            oscillator.frequency.exponentialRampToValueAtTime(100, now + 0.5);
                            gainNode.gain.setValueAtTime(0.4, now);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                            oscillator.start(now);
                            oscillator.stop(now + 0.5);
                            break;
                        case 'error':
                            oscillator.type = 'square';
                            oscillator.frequency.setValueAtTime(150, now);
                            gainNode.gain.setValueAtTime(0.3, now);
                            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                            oscillator.start(now);
                            oscillator.stop(now + 0.2);
                            break;
                    }
                } catch (e) { console.error("Native sound playback error:", e); }
            };
            
            soundToggleBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                soundToggleBtn.innerHTML = isMuted ? soundOffIcon : soundOnIcon;
                if (!isMuted && !audioReady) setupAudio();
            });

            // --- Game Constants & State ---
            const WORD_LENGTH = 5, MAX_TRIES = 6, WORDS_PER_SESSION = 10;
            let currentRow = 0, currentCol = 0, secretWord = '', isGameOver = false, isProcessing = false;
            let dailyWords = [], currentWordIndex = 0, wordsGuessedCorrectly = 0, totalAttempts = 0, score = 0;
            let boardState = []; // Array to store the state of the game board
            let totalTimePlayed = 0, timerInterval;

            const wordList = ["aback","abase","abate","abbey","abbot","abhor","abide","abled","abode","abort","about","above","abuse","abyss","acorn","acrid","actor","acute","adage","adapt","adept","admin","admit","adobe","adopt","adore","adorn","adult","affix","afire","afoot","afoul","after","again","agape","agate","agent","agile","aging","aglow","agony","agree","ahead","aider","aisle","alarm","album","alert","algae","alibi","alien","align","alike","alive","allay","alley","allot","allow","alloy","aloft","alone","along","aloof","aloud","alpha","altar","alter","amass","amaze","amber","amble","amend","amiss","amity","among","ample","amply","amuse","angel","anger","angle","angry","angst","anime","ankle","annex","annoy","annul","anode","antic","anvil","aorta","apart","aphid","aping","apnea","apple","apply","apron","aptly","arbor","ardor","arena","argue","arise","armor","aroma","arose","array","arrow","arson","artsy","ascot","ashen","aside","askew","assay","asset","atoll","atone","attic","audio","audit","augur","aunty","avail","avert","avian","avoid","await","awake","award","aware","awash","awful","awoke","axial","axiom","axion","azure","bacon","badge","badly","bagel","baggy","baker","baler","balmy","banal","banjo","barge","baron","basal","basic","basil","basin","basis","baste","batch","bathe","baton","batty","bawdy","bayou","beach","beady","beard","beast","beech","beefy","befit","began","begat","beget","begin","begun","being","belch","belie","belle","belly","below","bench","beret","berry","berth","beset","betel","bevel","bezel","bible","bicep","biddy","bigot","bilge","billy","binge","bingo","biome","birch","birth","bison","bitty","black","blade","blame","bland","blank","blare","blast","blaze","bleak","bleat","bleed","bleep","blend","bless","blimp","blind","blink","bliss","blitz","bloat","block","bloke","blond","blood","bloom","blown","bluer","bluff","blunt","blurb","blurt","blush","board","boast","bobby","boney","bongo","bonus","booby","boost","booth","booty","booze","b             // --- Date and Word Generation ---
            function getISTDateString() {
                const now = new Date();
                return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
            }

            function generateDailyWords() {
                const dateString = getISTDateString();
                const seed = dateString.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
                const startIndex = seed % (wordList.length - WORDS_PER_SESSION);
                dailyWords = wordList.slice(startIndex, startIndex + WORDS_PER_SESSION);
            }
            
            // --- Scoring System ---
            function calculateScore(attempts) {
                switch (attempts) {
                    case 1: return 100;
                    case 2: return 80;
                    case 3: return 60;
                    case 4: return 40;
                    case 5: return 20;
                    case 6: return 10;
                    default: return 0;
                }
            }
            
            // --- Timer Functions ---
            function updateTimerDisplay() {
                const hours = Math.floor(totalTimePlayed / 3600);
                const minutes = Math.floor((totalTimePlayed % 3600) / 60);
                const seconds = totalTimePlayed % 60;
                const formattedTime = [hours, minutes, seconds]
                    .map(v => v < 10 ? "0" + v : v)
                    .join(":");
                timerDisplay.textContent = `Time: ${formattedTime}`;
            }

            function startTimer() {
                if (timerInterval) return;
                timerInterval = setInterval(() => {
                    totalTimePlayed++;
                    updateTimerDisplay();
                }, 1000);
            }

            function stopTimer() {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            // --- Game State Persistence ---
             function getUserId() {
                const params = new URLSearchParams(window.location.search);
                return params.get("userId") || "guest";
            }
           async function saveGameState() {
               const userId = getUserId();
               const gameState = {
                    date: getISTDateString(),
                    currentRow,
                    currentCol,
                    wordsGuessedCorrectly,
                    totalAttempts,
                    currentWordIndex,
                    score,
                    totalTimePlayed,
                    boardState: getBoardState(),
                };
               const nameParam = new URLSearchParams(window.location.search).get("name");
               const name = nameParam ? JSON.parse(decodeURIComponent(nameParam)) : 'Player';

               if (!userId) return; // only exit if no userId found

                try {
                    const res = await fetch("https://erp.taxila.in/api/game/wordify", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ userId, name, gameState }),
                    });

                    if (!res.ok) {
                        console.error("Failed to save game state:", await res.text());
                    } else {
                        console.log("Game state saved for", userId);
                    }
                } catch (err) {
                    console.error("Error saving game state:", err);
                }
            }

            async function loadGameState() {
                 const userId = getUserId();
                 if (!userId) return null;

                try {
                     const res = await fetch(`https://erp.taxila.in/api/game/wordify?userId=${userId}`);
                     if (!res.ok) {
                        console.log("No previous game state found or failed to load.");
                        return null;
                     }
                     const savedData = await res.json();
                     if (savedData && Object.keys(savedData).length > 0) {
                         const gameState = savedData;
                         if (gameState.date === getISTDateString()) {
                             console.log('Game state loaded for today.');
                             return gameState;
                         } else {
                             console.log('Previous game state is from a different day. Starting new game.');
                             return null;
                         }
                     }
                } catch (err) {
                    console.error("Error loading game state:", err);
                    return null;
                }
                return null;
            }
            
            function getBoardState() {
                const board = [];
                const rows = gameBoard.children;
                for (let i = 0; i < rows.length; i++) {
                    const row = [];
                    const tiles = rows[i].children;
                    for (let j = 0; j < tiles.length; j++) {
                        const tile = tiles[j];
                        row.push({
                            letter: tile.querySelector('.tile-front').textContent,
                            status: tile.classList.contains('correct') ? 'correct' : tile.classList.contains('present') ? 'present' : tile.classList.contains('absent') ? 'absent' : ''
                        });
                    }
                    board.push(row);
                }
                return board;
            }

            function renderBoardState(state) {
                const rows = gameBoard.children;
                for (let i = 0; i < state.length; i++) {
                    const tiles = rows[i].children;
                    for (let j = 0; j < state[i].length; j++) {
                        const tileState = state[i][j];
                        const tile = tiles[j];
                        const front = tile.querySelector('.tile-front');
                        const back = tile.querySelector('.tile-back');
                        front.textContent = tileState.letter;
                        back.textContent = tileState.letter;
                        if (tileState.letter) {
                             tile.classList.add('filled');
                        }
                        if (tileState.status) {
                             tile.classList.add(tileState.status);
                        }
                        // Also update keyboard keys
                        if(tileState.status) {
                             const keyEl = keyboardContainer.querySelector(`[data-key="${tileState.letter.toLowerCase()}"]`);
                             if (keyEl) {
                                const isCorrect = keyEl.classList.contains('correct'), isPresent = keyEl.classList.contains('present');
                                if (tileState.status === 'correct') { keyEl.classList.remove('present', 'absent'); keyEl.classList.add('correct'); }
                                else if (tileState.status === 'present' && !isCorrect) { keyEl.classList.remove('absent'); keyEl.classList.add('present'); }
                                else if (tileState.status === 'absent' && !isCorrect && !isPresent) keyEl.classList.add('absent');
                             }
                        }
                    }
                }
            }

            // --- Game Setup and Flow ---
            async function main() {
                const dateString = getISTDateString();
                dateDisplay.textContent = new Date().toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', year: 'numeric', month: 'long', day: 'numeric' });
                generateDailyWords();
                const loadedState = await loadGameState();

                if (loadedState && loadedState.completed) {
                    showCompletedScreen(loadedState);
                } else {
                    currentWordIndex = loadedState ? loadedState.currentWordIndex : 0; 
                    wordsGuessedCorrectly = loadedState ? loadedState.wordsGuessedCorrectly : 0; 
                    totalAttempts = loadedState ? loadedState.totalAttempts : 0;
                    currentRow = loadedState ? loadedState.currentRow : 0;
                    currentCol = loadedState ? loadedState.currentCol : 0;
                    score = loadedState ? loadedState.score : 0;
                    totalTimePlayed = loadedState ? loadedState.totalTimePlayed : 0;

                    setupWordGame(loadedState);
                }
            }
           
            function setupWordGame(loadedState) {
                isGameOver = false; isProcessing = false;
                secretWord = dailyWords[currentWordIndex];
                titleElement.textContent = `WORDIFY (${currentWordIndex + 1}/${WORDS_PER_SESSION})`;
                scoreDisplay.textContent = `Score: ${score}`;
                updateTimerDisplay(); // Set initial time display
                gameBoard.innerHTML = '';
                for (let i = 0; i < MAX_TRIES; i++) {
                    const row = document.createElement('div');
                    row.className = 'grid grid-cols-5 gap-1.5';
                    for (let j = 0; j < WORD_LENGTH; j++) {
                        const tile = document.createElement('div');
                        tile.className = 'tile';
                        tile.innerHTML = `<div class="tile-inner"><div class="tile-front"></div><div class="tile-back"></div></div>`;
                        row.appendChild(tile);
                    }
                    gameBoard.appendChild(row);
                }
                createKeyboard();
                modal.classList.add('hidden');
                if (loadedState) {
                    renderBoardState(loadedState.boardState);
                }
                startTimer();
            }

            function createKeyboard() {
                keyboardContainer.innerHTML = '';
                const keys = ['q w e r t y u i o p', 'a s d f g h j k l', 'enter z x c v b n m backspace'];
                keys.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'flex justify-center gap-1 sm:gap-1.5 my-1 sm:my-1.5';
                    row.split(' ').forEach(key => {
                        const keyButton = document.createElement('button');
                        keyButton.className = 'key h-14 rounded font-bold uppercase flex items-center justify-center';
                        keyButton.dataset.key = key;
                        if (key === 'enter') {
                            keyButton.textContent = 'Enter'; keyButton.style.flex = '1.5'; keyButton.style.fontSize = '0.75rem';
                        } else if (key === 'backspace') {
                            keyButton.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path fill="currentColor" d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.12c.36.53.9.88 1.59.88h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"></path></svg>`;
                            keyButton.style.flex = '1.5';
                        } else {
                            keyButton.textContent = key; keyButton.style.flex = '1';
                        }
                        rowDiv.appendChild(keyButton);
                    });
                    keyboardContainer.appendChild(rowDiv);
                });
            }

            function handleInput(key) {
                if (!audioReady && !isMuted) setupAudio(); // Try to start audio on first interaction
                if (isGameOver || isProcessing) return;
                if (key === 'enter') submitGuess();
                else if (key === 'backspace') { removeLetter(); playSound('click'); } 
                else if (key.match(/^[a-z]$/)) { addLetter(key); playSound('click'); }
            }
            document.addEventListener('keydown', (e) => {
                if (typeof e.key === 'string') {
                    handleInput(e.key.toLowerCase());
                }
            });
            keyboardContainer.addEventListener('click', (e) => {
                const key = e.target.closest('[data-key]')?.dataset.key;
                if (key) handleInput(key);
            });

            function addLetter(letter) {
                if (currentCol < WORD_LENGTH) {
                    const tile = gameBoard.children[currentRow].children[currentCol];
                    const front = tile.querySelector('.tile-front');
                    const back = tile.querySelector('.tile-back');
                    front.textContent = letter; back.textContent = letter;
                    tile.classList.add('filled', 'pop');
                    tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
                    currentCol++;
                    saveGameState();
                }
            }

            function removeLetter() {
                if (currentCol > 0) {
                    currentCol--;
                    const tile = gameBoard.children[currentRow].children[currentCol];
                    const front = tile.querySelector('.tile-front');
                    const back = tile.querySelector('.tile-back');
                    front.textContent = ''; back.textContent = '';
                    tile.classList.remove('filled');
                    saveGameState();
                }
            }

            function submitGuess() {
                if (isProcessing) return;
                const guess = getCurrentGuess();
                if (currentCol !== WORD_LENGTH) { showMessage("Not enough letters"); playSound('error'); return; }
                if (!wordList.includes(guess)) { showMessage("Not in word list"); playSound('error'); return; }
                
                isProcessing = true; // Block input while processing
                totalAttempts++;
                checkGuess(guess);
            }
           
            function getCurrentGuess() {
                 return Array.from(gameBoard.children[currentRow].children).map(tile => tile.querySelector('.tile-front').textContent).join('');
            }

            function checkGuess(guess) {
                const row = gameBoard.children[currentRow];
                const letterCount = {};
                for(const letter of secretWord) letterCount[letter] = (letterCount[letter] || 0) + 1;
                for (let i = 0; i < WORD_LENGTH; i++) if (guess[i] === secretWord[i]) letterCount[guess[i]]--;
                
                let flipDelay = 0;
                for (let i = 0; i < WORD_LENGTH; i++) {
                    const tile = row.children[i], key = keyboardContainer.querySelector(`[data-key="${guess[i]}"]`);
                    let status = 'absent';
                    if (guess[i] === secretWord[i]) status = 'correct';
                    else if (secretWord.includes(guess[i]) && letterCount[guess[i]] > 0) { status = 'present'; letterCount[guess[i]]--; }
                   
                    setTimeout(() => {
                        tile.classList.add('flip');
                        if (status) tile.classList.add(status);
                        playSound('flip', { index: i });
                        const keyEl = key;
                        if (!keyEl) return;
                        const isCorrect = keyEl.classList.contains('correct'), isPresent = keyEl.classList.contains('present');
                        if (status === 'correct') { keyEl.classList.remove('present', 'absent'); keyEl.classList.add('correct'); }
                        else if (status === 'present' && !isCorrect) { keyEl.classList.remove('absent'); keyEl.classList.add('present'); }
                        else if (status === 'absent' && !isCorrect && !isPresent) keyEl.classList.add('absent');
                    }, i * 350);
                    flipDelay = i * 350;
                }
               
                setTimeout(() => {
                    if (guess === secretWord) {
                        wordsGuessedCorrectly++; 
                        score += calculateScore(currentRow + 1);
                        scoreDisplay.textContent = `Score: ${score}`;
                        playSound('win');
                        showModal("You Won!", ["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!"][currentRow]);
                        isGameOver = true; 
                    } else if (currentRow === MAX_TRIES - 1) {
                        playSound('lose'); 
                        showModal("Game Over", "The word was...");
                        isGameOver = true; 
                    }
                    
                    saveGameState(); // Save state after checking guess
                    
                    if (isGameOver) {
                      stopTimer();
                    } else {
                      currentRow++; currentCol = 0;
                    }
                    isProcessing = false; // Re-enable input after all animations and state changes are done
                }, flipDelay + 150);
            }

            function showMessage(msg) {
                const el = document.createElement('div');
                el.textContent = msg;
                el.className = 'bg-gray-800 text-white text-sm font-bold py-2 px-4 rounded-md shadow-lg';
                messageContainer.innerHTML = ''; messageContainer.appendChild(el);
                setTimeout(() => {
                    el.style.transition = 'opacity 0.5s'; el.style.opacity = '0';
                    setTimeout(() => messageContainer.innerHTML = '', 500);
                }, 1000);
            }
           
            function showModal(title, message) {
                standardModalContent.classList.remove('hidden');
                certificateContent.classList.add('hidden');
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalWord.textContent = secretWord;
                nextWordBtn.textContent = currentWordIndex < WORDS_PER_SESSION - 1 ? "Next Word" : "Show Final Score";
                modal.classList.remove('hidden');
            }
           
            function generateCertificate() {
                stopTimer();
                const dateString = new Date().toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', year: 'numeric', month: 'long', day: 'numeric' });
                standardModalContent.classList.add('hidden');
                certificateContent.classList.remove('hidden');
                certPlayerName.textContent = playerName;
                certScore.textContent = `Final Score: ${wordsGuessedCorrectly} / ${WORDS_PER_SESSION}`;
                certDate.textContent = `Date: ${dateString}`;
                certTime.textContent = `Time: ${Math.floor(totalTimePlayed / 3600).toString().padStart(2, '0')}:${Math.floor((totalTimePlayed % 3600) / 60).toString().padStart(2, '0')}:${(totalTimePlayed % 60).toString().padStart(2, '0')}`;
                modal.classList.remove('hidden');

                // Mark the game as completed for today to prevent starting a new one
                const finalStats = { date: getISTDateString(), wordsGuessedCorrectly, totalAttempts, completed: true, playerName, score, totalTimePlayed, boardState: getBoardState() };
                localStorage.setItem('wordifyGameState', JSON.stringify(finalStats));
            }
           
            function showCompletedScreen(stats) {
                stopTimer();
                const formattedTime = `${Math.floor(stats.totalTimePlayed / 3600).toString().padStart(2, '0')}:${Math.floor((stats.totalTimePlayed % 3600) / 60).toString().padStart(2, '0')}:${(stats.totalTimePlayed % 60).toString().padStart(2, '0')}`;
                gameBoard.innerHTML = `<div class="col-span-5 row-span-6 flex flex-col items-center justify-center text-center p-4"><h2 class="text-2xl font-bold mb-4">Today's puzzle completed!</h2><p>Come back tomorrow for a new challenge.</p><div class="mt-6 text-lg"><h3 class="font-bold text-xl mb-2">Your Score:</h3><p>Correct Words: <span class="font-bold">${stats.wordsGuessedCorrectly} / ${WORDS_PER_SESSION}</span></p><p>Total Attempts: <span class="font-bold">${stats.totalAttempts}</span></p><p>Total Score: <span class="font-bold">${stats.score}</span></p><p>Time Taken: <span class="font-bold">${formattedTime}</span></p></div></div>`;
                keyboardContainer.innerHTML = '';
            }

            function handleNextWord() {
                if (currentWordIndex < WORDS_PER_SESSION - 1) {
                    currentWordIndex++;
                    currentRow = 0;
                    currentCol = 0;
                    saveGameState(); // Save state for the new word
                    setupWordGame(loadGameState());
                } else {
                    generateCertificate();
                }
            }
           
            nextWordBtn.addEventListener('click', handleNextWord);
            
            // --- Startup & Name Handling ---
            startGameBtn.addEventListener('click', () => {
                setupAudio(); // Initialize audio on first user gesture
                const name = playerNameInput.value.trim();
                if (name) {
                    playerName = name;
                    localStorage.setItem('wordifyPlayerName', name);
                    nameModal.classList.add('hidden');
                    main();
                } else {
                    playerNameInput.placeholder = "Please enter a name!";
                }
            });

            linkedinShareBtn.addEventListener('click', () => {
                const formattedTime = `${Math.floor(totalTimePlayed / 3600).toString().padStart(2, '0')}:${Math.floor((totalTimePlayed % 3600) / 60).toString().padStart(2, '0')}:${(totalTimePlayed % 60).toString().padStart(2, '0')}`;
                const scoreText = `I scored ${wordsGuessedCorrectly}/${WORDS_PER_SESSION} on today's Wordify challenge with a total score of ${score} in ${formattedTime}!`;
                const postTitle = `I completed the Wordify challenge!`;
                const summary = `${scoreText} Wordify is a great brain game from Taxila Business School. #Wordify #TaxilaBusinessSchool #BrainGames`;
                const url = `https://www.linkedin.com/shareArticle?mini=true&url=${encodeURIComponent('https://taxila.in/')}&title=${encodeURIComponent(postTitle)}&summary=${encodeURIComponent(summary)}`;
                window.open(url, '_blank');
            });
            
            // --- App Initializer ---
            function initializeApp() {
                const savedName = localStorage.getItem('wordifyPlayerName');
                if (savedName) {
                    playerName = savedName;
                    nameModal.classList.add('hidden');
                    main();
                } else {
                    nameModal.classList.remove('hidden');
                }
            }
            
            initializeApp();
            window.addEventListener('beforeunload', saveGameState);
        });
    </script>
</body>
</html>
